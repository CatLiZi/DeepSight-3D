<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">DeepSight-3D audio visual architecture</title><desc id="desc">Two perception branches feed visual-first selection and bounded head control. Motor feedback assists body microphone coordinate transformation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a4c4d3"/></marker></defs>
<style>text{font-family:Inter,Arial,sans-serif} .title{font-size:34px;font-weight:700;fill:#edf8fb} .sub{font-size:17px;fill:#a7c1cd} .box-title{font-size:17px;font-weight:700;fill:#f1fbff} .body{font-size:15px;fill:#c0d1da} .foot{font-size:15px;fill:#9db9c6}</style>
<rect width="1440" height="760" rx="28" fill="#071b28"/><text x="42" y="67" class="title">AUDIO + VISION → SELECT → TURN</text>
<text x="42" y="101" class="sub">Independent perception branches feed a visual-first selector; reliable audio assists.</text>
<rect x="42" y="145" width="280" height="155" rx="18" fill="#102a3a" stroke="#30546a"/><rect x="42" y="145" width="7" height="155" rx="4" fill="#43d6c8"/><text x="64" y="180" class="box-title">01  STEREO CAMERA</text><text x="64" y="209" class="body">3840 × 1080 MJPEG</text><text x="64" y="233" class="body">Single side-by-side frame</text><text x="64" y="257" class="body">1920 × 1080 per eye</text><rect x="360" y="145" width="340" height="155" rx="18" fill="#102a3a" stroke="#30546a"/><rect x="360" y="145" width="7" height="155" rx="4" fill="#43d6c8"/><text x="382" y="180" class="box-title">02  VISUAL PERCEPTION</text><text x="382" y="209" class="body">SCRFD detection per eye</text><text x="382" y="233" class="body">Stereo alignment + association</text><text x="382" y="257" class="body">Shared visual bearing</text><rect x="42" y="390" width="280" height="155" rx="18" fill="#102a3a" stroke="#30546a"/><rect x="42" y="390" width="7" height="155" rx="4" fill="#80b9ff"/><text x="64" y="425" class="box-title">03  FOUR RAW MICS</text><text x="64" y="454" class="body">CH2 / CH3 · moving ears</text><text x="64" y="478" class="body">CH1 / CH4 · fixed body</text><text x="64" y="502" class="body">48 kHz · 16-bit WASAPI RAW</text><rect x="360" y="390" width="340" height="155" rx="18" fill="#102a3a" stroke="#30546a"/><rect x="360" y="390" width="7" height="155" rx="4" fill="#80b9ff"/><text x="382" y="425" class="box-title">04  ACOUSTIC DIRECTION</text><text x="382" y="454" class="body">Silero speech support</text><text x="382" y="478" class="body">Reliable-band pairwise TDOA</text><text x="382" y="502" class="body">Pose-aware conditional fusion</text><rect x="755" y="255" width="295" height="180" rx="18" fill="#102a3a" stroke="#30546a"/><rect x="755" y="255" width="7" height="180" rx="4" fill="#e8b464"/><text x="777" y="290" class="box-title">05  TARGET SELECTION</text><text x="777" y="319" class="body">Visual-first tracking</text><text x="777" y="343" class="body">Sound-sector association</text><text x="777" y="367" class="body">Recency + switch protection</text><text x="777" y="391" class="body">Fallback when uncertain</text><rect x="1095" y="255" width="303" height="180" rx="18" fill="#102a3a" stroke="#30546a"/><rect x="1095" y="255" width="7" height="180" rx="4" fill="#e8b464"/><text x="1117" y="290" class="box-title">06  HEAD CONTROL</text><text x="1117" y="319" class="body">Persistent yaw destination</text><text x="1117" y="343" class="body">Bounded smooth trajectory</text><text x="1117" y="367" class="body">Position feedback + limits</text><text x="1117" y="391" class="body">Stop / fault / visual takeover</text><g fill="none" stroke-width="3" marker-end="url(#arrow)">
